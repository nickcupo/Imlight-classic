[Global Settings]
GameRevision = r803238.Wizard_1_610
; If true, the servers will refuse connections if the game revision does not match.
EnforceRevision = false

[Logging]
LogPath = ./logs/log.txt
; The minimum log level to be written to the log file. Valid values are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
LogLevel = DEBUG
; CLASSIC: daily log files kept (Serilog's default is 31), and the size at which a day's file rolls over (MB).
RetainedFileCount = 14
FileSizeLimitMB = 100
LogFormat = {Timestamp:yyyy-MM-dd HH:mm:ss.fff} {Level:u3} {CallingSpace} : {Message:lj} {NewLine}{Exception}
SeqSinkUrl = http://localhost:5341

[Locale]
Language = en-US

[Network]
; Bind locally by default. Set the deployment interface IP to accept LAN connections.
; Omitting ListenAddress preserves the stock 0.0.0.0 binding.
ListenAddress = 127.0.0.1
; CLASSIC: open connections per client address on each server (login, game, patch). 0 = no limit.
; Loopback addresses are exempt unless ConnectionLimitLoopback = true (local bots).
MaxConnectionsPerIp = 16
; CLASSIC: open connections per server.
MaxConnections = 2000
ConnectionLimitLoopback = false

[Login Server]
; The internal name for the login server. This is not a realm name.
LoginServerName = Imlight.Login
LoginServerPort = 12000
LoginPlayerLimit = 1000
MaxAllowedCharactersPerAccount = 6
; The time in seconds that a user can be AFK before being disconnected.
LoginAfkTimeout = 360
; The time in seconds between AFK checks.
LoginAfkCheckInterval = 60
; CLASSIC: a login connection must log in within this many seconds of its SessionAccept (the client
; accepts when the player presses Login, or at once with a launcher key). 0 = no limit.
LoginAuthTimeout = 30
; CLASSIC: failed password logins allowed on one connection before it is closed.
LoginFailuresPerConnection = 1
; CLASSIC: brute-force lockouts, shared by the game login and the launcher login. An account is
; locked after AccountFailuresBeforeLockout failures inside FailureWindowMinutes, an address after
; AddressFailuresBeforeLockout; each lockout in a row doubles from FirstLockoutSeconds up to
; MaxLockoutMinutes. Failures are logged with the username and address (never the password).
AccountFailuresBeforeLockout = 5
AddressFailuresBeforeLockout = 20
FailureWindowMinutes = 15
FirstLockoutSeconds = 60
MaxLockoutMinutes = 30
; CLASSIC: a login session key (in-client login or launcher) expires after this many minutes
; without use (a validate, an attach or leaving the game refreshes it), and LoginKeyMaxHours after
; it was issued at the latest. LoginKeyBindIp: it only answers the address it was issued to.
LoginKeyIdleMinutes = 30
LoginKeyMaxHours = 12
LoginKeyBindIp = true

[Game Server]
; The internal name for the game server. This is not a realm name.
GameServerName = Imlight.Game
GameServerPort = 12333
GameServerPlayerLimit = 1000
GameServerIP = 127.0.0.1
; The number of game servers (realms) the Director will create.
GameServerCount = 3
; The number of game servers that can be created.
MaxGameServersAllowed = 3
; Comma-separated list of realm names. Must have at least GameServerCount entries.
RealmNames = Centaur,Pegasus,Phoenix
; CLASSIC: the time in seconds a game-server attach key accepts its next attach after character
; select or a server transfer (clamped to 30..900). Keys are random, single-use per attach, and
; re-armed by each MSG_SERVERTRANSFER the server sends.
SessionKeyValidityTime = 300
; CLASSIC: the attach must come from the address that selected the character.
SessionKeyBindIp = true

[Combat]
; The current health percent a creature must to decide healing itself on a prepare turn.
HealingThreshhold = 0.75
; The percent chance a creature will heal itself on a prepare turn.
HealingPercentChance = 0.5
; The percent chance a creature will pass on a prepare turn.
PreparePassChance = 0.33
; The amount of aggro increase a player will receive upon damaging a creature.
DamagedAggroIncrease = 5
; The amount of aggro increase a player will receive upon healing a teammate.
HealingAggroIncrease = 3
; The amount of aggro increase a player will receive upon using the 'Provoke' spell on a creature.
ProvokeAggroIncrease = 20
; The amount of aggro decrease a player will receive upon using the 'Pacify' spell on a creature.
PacifyAggroDecrease = 50

[Character]
StartingLevel = 1
; If true, new characters skip the tutorial and start in StartingZone.
TutorialDisabled = false
; Starter kit template IDs, comma-separated. Granted in the tutorial, or on first login when TutorialDisabled.
; Do not exceed 16 items: RavenDB has a batch limit of 16.
DefaultItems = 1317127,1317128,1317125,1317124,1317126,1317129,1317130,1317131,1317132,1317133,1317234,87256,284071,126983
StartingZone = WizardCity/Interiors/WC_Headmistress_House
StartingWorld = 1
BaseGoldPouch = 1000000
MaxLevel = 200
MaxInventoryItems = 75
MaxJewelsAllowed = 100
MaxFriends = 100
PetEnergyTickInSeconds = 450

[Patch Server]
; The internal name for the patch server. This is not a realm name.
PatchServerName = Imlight.Patch
; The port used by the patch server.
PatchServerPort = 12500
; The URL to the patch server.
PatchServerInternalUrl = http://127.0.0.1:12369
; The time in seconds that the patch server will wait to reach the endpoint before timing out.
PatchServerInternalTimeout = 10
; The time in seconds that any given download will wait before timing out.
PatchServerDownloadTimeout = 360
LocalWadCachePath = ./cache

[April Fools]
RandomizeCreatures = false
RandomizeGateways = false
RandomBackflips = false

[Database]
PlayerDatabaseUrl =
PlayerDatabaseName = Playerdata
PlayerDatabaseCertificatePath = ../playerdb-dev-1yr.pfx
; The GitHub repository (owner/repo) containing the spiralDB world data.
SpiralDBRemote = Revive101/spiraldb
; The branch or tag to track within the repository.
SpiralDBBranch = main
; The local directory where the repository is cloned / cached.
SpiralDBLocalPath = ./spiraldb-cache
; If true, the repository is fetched on every boot to pull the latest data.
SpiralDBAutoFetch = true
; If true, the remote is never contacted — only local data is used.
SpiralDBDisableRemote = false
; The maximum time in seconds to wait for a git fetch to complete.
SpiralDBFetchTimeout = 30
; If true, keep the previous in-memory data when a fetch or parse fails.
SpiralDBRollbackOnFailure = true
; CLASSIC: folders layered over SpiralDBLocalPath after it loads, comma-separated, applied in order (a later
; folder wins). Each uses SpiralDB's subfolders (QuestTemplates, DropTables, NpcInventory, ZoneTransfer, ...);
; a record replaces the loaded record with the same key. QuestTemplates/_disabled.txt, one quest name per line,
; disables those quests (# starts a comment). A ZoneTransfer record with "Merge": true adds its entries to the zone's
; record by trigger name instead (a null Teleport removes one); a folder's merge records apply after its full records.
; Only *.json files are read, so *.provenance.yaml sidecars are ignored.
; Relative paths resolve against the working directory. Overlays are never fetched, and the SpiralDB sync is
; skipped if an overlay overlaps SpiralDBLocalPath. Empty = none.
SpiralDBOverlayPaths =
AdminAccountUsername = admin
AdminAccountPassword = compsci
; CLASSIC: more accounts to create at boot if they don't exist yet.
; Format: user:password[:authlevel], comma-separated. authlevel 0 None, 1 QualityAssurance,
; 2 HallMonitor, 3 Developer, 4 Administrator (default 0). Passwords cannot contain ':' or ','.
SeedAccounts =
DatabaseMaxNumberOfRequestsPerSession = 16
DatabaseRequestTimeoutInSeconds = 90
DatabaseWaitForNonStaleResultsTimeout = 5
; The directory where the embedded database will be stored.
EmbeddedDatabaseDataDirectory = ../ImlightEmbeddedDatabase/
; The port used by the embedded database.
EmbeddedDatabasePort = 8080
; The time in seconds that the embedded database will wait to reach the endpoint before timing out.
EmbeddedDatabaseTimeoutTime = 90
; If true, a full RavenDb database will be used. The full database includes a dotnet runtime.
EmbeddedDatabaseUseFull = False
; The path to the full RavenDb. Only used if EmbeddedDatabaseUseFull is true.
EmbeddedDatabaseFullPath = ../RavenDB/Server/

[Advanced]
; Please only change these settings if you know what you are doing.
CharacterUploadIntervalInMinutes = 6
; Unused since attach keys are random (it was the salt of a public, deterministic key).
SessionKeyHashInput =
PatchServerBufferSize = 4096
PatchServerUserAgent = Imlight Patcher
; The size of the buffer used by the session actor.
SessionActorBufferSize = 4096
; The thread pool size used by the session actor to send messages.
SessionActorSendPoolSize = 3
; The thread pool size used by the session actor to receive messages.
SessionActorReceivePoolSize = 3
; If true, the session actor will close on exception.
SessionActorCloseOnException = True
; The number of times the session actor will restart a service before crashing.
SessionActorServiceRetryCount = 3
; The time in seconds that the session actor will wait before restarting.
SessionActorServiceRangeRetry = 30
; The time in seconds that the server will send a heartbeat to the client.
KeepAliveInterval = 60
; The time in seconds the server will wait for a heartbeat response.
KeepAliveRspWaitTime = 15
; CLASSIC: The time in seconds a new connection has to answer the server's session offer. Clients started
; with -L connect during startup and answer only after their patcher window, so this is much longer
; than KeepAliveRspWaitTime. Default 300.
SessionAcceptWaitTime = 300
; CLASSIC: the same wait for a game-server connection (opened by a running client at attach). Default 30.
GameSessionAcceptWaitTime = 30
; CLASSIC: messages a connection may send before finishing its handshake; more closes it. Default 16.
PreHandshakeMessageLimit = 16
; How many requests are allowed within the token bucket of the session actor.
SessionTokenBucketMax = 150
; How many new tokens are added to the token bucket per second.
SessionTokenBucketPerSecond = 50
; How many times the session actor will try to acquire a token before failing.
SessionTokenBucketFailedAcquisitionLimit = 5
; The time in seconds that the local wad cache will wait for the patch server to respond.
LocalWadCacheWaitForPatchServerTimeout = 10

[Classic]
; CLASSIC: the rules profile this server enforces, by id: late-2009 (canonical, the game as of
; 2010-05-25), arc1-2009h1 (first half of 2009) or dev-unrestricted (stock Imlight, no gates).
; Empty, or no [Classic] section at all, runs stock Imlight without loading classic-data.
Profile = late-2009
; CLASSIC: renaming quests first served under made-up names to their KingsIsle names
; (classic-data/quests/quest-name-aliases.yaml) in saved characters at start-up: apply (default),
; dry-run (count and log what would change, write nothing) or off. Idempotent.
QuestNameMigration = apply
; Directory with the profile YAML files. Empty: search upward from the server binary's directory
; for classic-data/profiles. A relative path resolves against the server binary's directory, not
; the working directory.
ProfilesPath =
; The zone-to-world map. Empty: zones/worlds.yaml in the classic-data directory that holds
; ProfilesPath. A relative path resolves like ProfilesPath. Not loaded when the profile restricts
; nothing (dev-unrestricted).
ZoneWorldsPath =
; The spell records whose 2009 pip costs, accuracy and effect values replace the client's in
; combat. Empty: spells/ in the classic-data directory that holds ProfilesPath. A relative path
; resolves like ProfilesPath. Not loaded when the profile restricts nothing (dev-unrestricted). A
; path set here that does not exist stops the boot; a missing default directory only warns, and
; every spell keeps the client's values.
SpellsPath =
; If true, also log allowed zone decisions. Denials, fallbacks and refusals are always logged.
AuditVerbose = false
; Directory of older zone packages (<World>-<Zone>.wad, from the 2014 client) that replace the patch
; server's for zones remade after 2014. The players' clients need the same files
; (tools/mac/classic-zones.sh). Empty: every zone comes from the patch server.
ZoneWadsPath =
; CLASSIC: if true, any password (even an empty one) logs in to an existing account; only the
; username has to match. For a private LAN server only.
AnyPasswordLogin = false
; CLASSIC: whether the client's own login screen may log in with a password. The protocol needs the
; server to keep Base64(SHA-512(password)), which is password-equivalent; false keeps only a PBKDF2
; verifier (launcher logins), and drops the protocol hash from each account at its next login.
InClientPasswordLogin = true
; CLASSIC: a file with Base64 of 32 random bytes (created, mode 600, if missing). When set, the
; protocol hash is stored encrypted with it (AES-256-GCM). Keep it out of off-site backups.
PasswordKeyFile =
; CLASSIC: a paired Minion Helper pairs again after this many days.
MinionHelperTokenDays = 90
; CLASSIC: a Myth wizard chooses their minion's card and target in the Minion Helper (a small Mac
; window) instead of leaving it to the AI. Players type .minions in chat to pair it. On by default.
OwnedMinionControl = true
; The TCP port the Minion Helper connects to. Empty: 12090. 0 turns the helper off.
; The same port serves the players' launcher: the classic client patches and the launcher login.
MinionHelperPort = 12090
; CLASSIC: the pause (ms) between a Myth wizard's pick and their minion's hand in the card window. Empty: 750.
MythMinionHandDelayMs =
; CLASSIC: the owner's server switches. Each has a 2009 default; the admin dashboard changes the live ones and keeps
; them in SettingsOverridePath (relative to the working directory), which wins over these lines.
; SettingsOverridePath = classic-settings.json
; XpMultiplier = 1
; GoldMultiplier = 1
; DropRateMultiplier = 1
; BackpackSize = 0                  ; 0: 150 with a classic profile, else Character.MaxInventoryItems
; BankSize = 100                    ; dorm bank slots (the shared bank keeps 100)
; SpellAnimationSpeed = 1           ; shortens the server's wait for spell animations
; TeleportToFriendAnywhere = true
; CombatRejoinSeconds = 120         ; a dropped wizard keeps their seat this long; 0: flee at once
; RestartMaxWaitMinutes = 10        ; a safe restart waits for fights at most this long
; ZoneTransferDelayMs = 250         ; wait before the server transfer on a zone change (upstream 1000)
; HolidayEvents = true              ; classic-data/holidays on the real calendar
; HolidayDateOverride = 0           ; yyyyMMdd to test an event
; BazaarStocked = true
; BazaarRestockMinutes = 60
; BazaarStockPerRestock = 120
; OpenPvp = true                    ; classic-data/pvp circles in the Wizard City Arena
; PvpCountdownSeconds = 20
; CLASSIC: the Pet Pavilion (May 2010; owner extra): the pet park zones, pet energy, and the 2010 pet loop: the
; four pet games at their kiosks (Dance Game played round by round; Gobbler Drop, Mortar Mayhem and the Maze open
; but have no server game data yet), stat points and pet experience, one snack after each game, levels Baby to
; Epic with one talent a level, the snack shop's 2010 stock, and egg hatching.
; PetPavilion = true
; CLASSIC: movement guard: an impossible move (speed or teleport hack) is answered with a server teleport back to the
; last accepted spot, never a kick. MovementMaxSpeed is units per second (run speed ~600), with a 3 s lag catch-up.
; MovementGuard = true
; MovementMaxSpeed = 1500
; CLASSIC: the admin dashboard (Administrator accounts; 0 turns it off) and where it listens (default: ListenAddress).
; AdminDashboardPort = 12380
; AdminDashboardAddress =
; CLASSIC: the calendar day holiday events and the daily Second Chance uses follow: an IANA zone id such as
; America/New_York. Empty: the machine's zone (UTC on the live container). Logs and timers stay on UTC.
GameTimeZone =
; CLASSIC: safe backups write <ControlDirectory>/backup-request for w101c-backup.path; the dashboard lists BackupDirectory.
; The nightly backup writes <ControlDirectory>/backup-schedule when players are on; the server warns and backs up.
; ControlDirectory = /var/lib/w101c/control
; BackupDirectory = /var/lib/w101c/backups
; CLASSIC: the thread pool's minimum worker threads. Handlers that still block (database calls, Asks)
; otherwise starve every zone and session for seconds on a small box. 0 keeps the .NET default (one
; per core). Default 64.
MinWorkerThreads = 64
; CLASSIC: if above 0, log one PERF line every this many seconds: handler times, zone mailbox waits,
; thread-pool and Akka dispatcher delays, GC and combat round turnaround. 0 = off.
PerfLogSeconds = 0
; CLASSIC: server-side ambient wizards (no accounts, no connections) that walk the hubs and streets,
; stand at shops, fight street mobs, chat, accept friends and offer help in players' fights (they
; ask first and join only on a yes). A number per zone, or off. Default 4.
AmbientWizards = 4
; Zones, comma-separated, each optionally zone:count. Empty: the Commons, Unicorn Way, the Shopping
; District and every world hub the profile opens.
AmbientWizardZones =
; Chat: 2009-style lines, replies and greetings (rule-based; see AmbientWizardLlm). Default true.
AmbientWizardChat = true
; Offer help in real players' fights (ask first). Default true.
AmbientWizardBattles = true
; Fight street mobs on their own. Default true.
AmbientWizardStreetFights = true
; Pet Pavilion wizards have Adult pets, answer players' hatch requests and now and then offer one. With
; the default zones this also puts wizards in the Pet Pavilion. Default true.
AmbientWizardHatching = true
; Bazaar wizards buy and sell at the Olde Town Bazaar, so its stock changes as it did with many players.
; With the default zones this also puts wizards in the Bazaar room. Default true.
AmbientWizardBazaar = true
; CLASSIC: optional small local language model for some ambient lines (llama.cpp llama-server, installed by
; deploy/linux/llm/install-llm.sh). Default false. Only a loopback or private-network address is accepted; the game
; never waits for it (timeout, then the rule-based line) and every line is filtered (length, era, chat dictionary).
AmbientWizardLlm = false
; AmbientWizardLlmUrl = http://127.0.0.1:8088
; Hard limit per request in ms (default 5000), requests a minute (default 6), tokens a line (default 24).
; AmbientWizardLlmTimeoutMs = 5000
; AmbientWizardLlmPerMinute = 6
; AmbientWizardLlmMaxTokens = 24
; CLASSIC: group for dungeons. When a real player starts a dungeon sigil's countdown, ambient wizards
; that can see it, of a fitting level, may step on too, follow the player inside, fight with them
; and leave with them. A player who says no is left alone for 30 minutes. Needs chat. Default true.
AmbientWizardDungeons = true
; The chance (0..1) that each fitting ambient wizard comes over. Default 0.35.
AmbientWizardDungeonChance = 0.35
; At most this many ambient wizards join one group (0..3; real players always come first). Default 2.
AmbientWizardDungeonHelpers = 2
; CLASSIC: the folder tools/mac/classic-publish.py uploads (manifest.json, news.txt, files/), served
; read-only at http://<server>:<MinionHelperPort>/classic/ for the launcher. Empty: no patches served.
ClientPatchesPath =
; CLASSIC: the patch port of KingsIsle's own launcher (the 2009-2014 WizardLauncher.exe, tools/mac/launcher-2014.sh):
; it answers the launcher's file-list request with nothing to patch. Its news page and file list are served on
; MinionHelperPort (/launcher/news). Empty or 0: off.
LauncherPatchPort =
